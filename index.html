<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>গভীর — চব্বিশ তলা</title>
<meta name="description" content="একটা ডেক-বিল্ডিং ডানজিয়ন গেম। চব্বিশ তলা, তিন প্রহরী।">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ================= TITLE ================= -->
  <section id="scr-title" class="scr">
    <div class="title-wrap">
      <div class="rune">▼</div>
      <h1>গভীর</h1>
      <p class="sub">চব্বিশ তলা। তিন প্রহরী। এক পথ নিচে।</p>
      <button id="btn-start" class="big-btn">নেমে যাই</button>
      <div id="meta-info" class="meta-info"></div>
      <div class="title-help">
        <p><b>কীভাবে খেলবেন</b> — প্রতিটা তলায় একটা রাস্তা বেছে নিন। লড়াইয়ে কার্ড খেলে শত্রু মারুন।
        শক্তি (⚡) সীমিত, তাই প্রতিটা কার্ড ভাবনামতো খেলুন। মরে গেলে শুরু থেকে — কিন্তু যতবার খেলবেন,
        ততবার নতুন কার্ড পাবেন।</p>
      </div>
      <button id="btn-mute" class="icon-btn" title="শব্দ">🔊</button>
    </div>
  </section>

  <!-- ================= MAP ================= -->
  <section id="scr-map" class="scr hidden">
    <header class="topbar">
      <div class="tb-item"><span class="tb-lbl">তলা</span><span id="map-floor" class="tb-val">১/২৪</span></div>
      <div class="tb-item"><span class="tb-lbl">প্রাণ</span><span id="map-hp" class="tb-val hp">৭০/৭০</span></div>
      <div class="tb-item"><span class="tb-lbl">স্বর্ণ</span><span id="map-gold" class="tb-val gold">৯৯</span></div>
      <div class="tb-item"><span class="tb-lbl">কার্ড</span><span id="map-deck" class="tb-val">১০</span></div>
    </header>
    <div id="map-track" class="track"></div>
    <h2 id="map-title" class="map-title">কোথায় যাবেন?</h2>
    <div id="map-options" class="map-options"></div>
    <div id="map-relics" class="relic-row"></div>
  </section>

  <!-- ================= COMBAT ================= -->
  <section id="scr-combat" class="scr hidden">
    <div class="combat-top">
      <div id="player-panel" class="player-panel"></div>
      <div id="enemies" class="enemies"></div>
    </div>
    <div id="combat-log" class="combat-log"></div>
    <div id="hand" class="hand"></div>
    <div class="combat-bottom">
      <div id="piles" class="piles"></div>
      <button id="btn-end" class="end-btn">পালা শেষ</button>
    </div>
  </section>

  <!-- ================= OTHER SCREENS ================= -->
  <section id="scr-reward" class="scr hidden"></section>
  <section id="scr-shop" class="scr hidden"></section>
  <section id="scr-rest" class="scr hidden"></section>
  <section id="scr-event" class="scr hidden"></section>
  <section id="scr-end" class="scr hidden"></section>

  <!-- floating numbers -->
  <div id="fx-layer" class="fx-layer"></div>
</div>
<script src="game.js"></script>
</body>
</html>
